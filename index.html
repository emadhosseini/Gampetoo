<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />

    <title>Gampetoo — برنامه تمرینی و غذایی شخصی</title>
    <meta
      name="description"
      content="گامپتو اپلیکیشن برنامه‌ریزی تمرین و تغذیه شخصی است: کالری‌شماری هوشمند، گزارش پیشرفت، و برنامه‌ی تمرینی و غذایی متناسب با هدف تو."
    />
    <link rel="canonical" href="https://gampetoo.com/" />

    <!-- Open Graph / Twitter card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gampetoo" />
    <meta property="og:url" content="https://gampetoo.com/" />
    <meta property="og:title" content="Gampetoo — برنامه تمرینی و غذایی شخصی" />
    <meta
      property="og:description"
      content="گامپتو اپلیکیشن برنامه‌ریزی تمرین و تغذیه شخصی است: کالری‌شماری هوشمند، گزارش پیشرفت، و برنامه‌ی تمرینی و غذایی متناسب با هدف تو."
    />
    <meta property="og:image" content="https://gampetoo.com/icon-512.png" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gampetoo — برنامه تمرینی و غذایی شخصی" />
    <meta
      name="twitter:description"
      content="گامپتو اپلیکیشن برنامه‌ریزی تمرین و تغذیه شخصی است: کالری‌شماری هوشمند، گزارش پیشرفت، و برنامه‌ی تمرینی و غذایی متناسب با هدف تو."
    />
    <meta name="twitter:image" content="https://gampetoo.com/icon-512.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect + a real <link> instead of a CSS @import, so the
         font request starts in parallel with everything else instead of
         waiting behind an extra network round-trip through index.css.
         Trimmed to the 4 weights actually used (400/600/700/800). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
